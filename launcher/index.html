<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Privacy Settings</title>
<style>
:root{
  --bg:#0f0f0f;--surface:#1a1a1a;--surface2:#222;--border:rgba(255,255,255,.07);
  --text:#e2e2e2;--muted:#787878;--green:#4caf7d;--red:#e05252;--orange:#e8974a;
  --accent:#7c9cbf;--r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);font-size:15px}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column}
#header{padding:20px 18px 14px;background:var(--bg);border-bottom:1px solid var(--border);
  flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
#header h1{font-size:20px;font-weight:600;letter-spacing:-.3px}
#root-badge{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:500;
  background:rgba(76,175,125,.15);color:var(--green);border:1px solid rgba(76,175,125,.25)}
#root-badge.no-root{background:rgba(224,82,82,.12);color:var(--red);border-color:rgba(224,82,82,.2)}
#scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 0 40px}
#scroll::-webkit-scrollbar{display:none}

.section{margin:20px 0 0}
.section-title{font-size:11px;font-weight:600;letter-spacing:.9px;text-transform:uppercase;
  color:var(--accent);padding:0 18px 8px}
.card{margin:0 12px;background:var(--surface);border-radius:var(--r);
  border:1px solid var(--border);overflow:hidden}
.card+.section{margin-top:28px}

.row{display:flex;align-items:center;padding:13px 14px;
  border-bottom:1px solid var(--border);min-height:62px;gap:10px}
.row:last-child{border-bottom:none}
.row-text{flex:1;min-width:0}
.row-label{font-size:14px;font-weight:500;line-height:1.2}
.row-desc{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.3}
.row-end{display:flex;align-items:center;gap:8px;flex-shrink:0}

/* status pill */
.pill{font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;
  padding:3px 8px;border-radius:20px;white-space:nowrap}
.pill-on{background:rgba(224,82,82,.14);color:var(--red);border:1px solid rgba(224,82,82,.2)}
.pill-off{background:rgba(76,175,125,.14);color:var(--green);border:1px solid rgba(76,175,125,.2)}
.pill-na{background:rgba(120,120,120,.12);color:var(--muted);border:1px solid rgba(120,120,120,.15)}
.pill-loading{background:rgba(120,120,120,.1);color:var(--muted);border:1px solid var(--border)}

/* action button */
.btn{font-size:12px;font-weight:600;padding:6px 13px;border-radius:8px;border:none;
  cursor:pointer;white-space:nowrap;transition:opacity .12s}
.btn:active{opacity:.7}
.btn-disable{background:rgba(224,82,82,.18);color:var(--red)}
.btn-enable{background:rgba(120,120,120,.15);color:var(--muted)}
.btn-na{display:none}

/* section action */
.section-btn-wrap{padding:10px 12px 0}
.section-btn{display:block;width:100%;text-align:center;padding:12px;font-size:13px;font-weight:500;
  background:rgba(224,82,82,.1);border:1px solid rgba(224,82,82,.18);border-radius:10px;
  color:var(--red);cursor:pointer;transition:opacity .12s}
.section-btn:active{opacity:.7}
.section-btn.working{opacity:.5;pointer-events:none}

/* toggle rows (hardening) */
.sw{position:relative;width:46px;height:26px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw-track{position:absolute;inset:0;border-radius:13px;background:rgba(255,255,255,.12);
  transition:background .2s;cursor:pointer}
.sw-track::before{content:'';position:absolute;width:20px;height:20px;
  left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s;opacity:.9}
.sw input:checked+.sw-track{background:var(--green)}
.sw input:checked+.sw-track::before{transform:translateX(20px)}

/* hours input */
#sp-hours{width:60px;background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font:14px system-ui;padding:7px;text-align:center}

.run-btn{display:block;width:100%;text-align:center;padding:13px;font-size:13px;
  font-weight:500;background:rgba(124,156,191,.12);border:1px solid rgba(124,156,191,.2);
  border-radius:10px;color:var(--accent);cursor:pointer;margin-top:10px}
.run-btn:active{opacity:.7}

#status-bar{padding:8px 18px;font-size:11px;color:var(--muted);min-height:30px;
  border-top:1px solid var(--border);flex-shrink:0;text-align:center}
</style>
</head>
<body>
<div id="wrap">
  <div id="header">
    <h1>Privacy Settings</h1>
    <span id="root-badge" class="no-root">No Root</span>
  </div>
  <div id="scroll">

    <!-- ── DE-SAMSUNG ──────────────────────────────── -->
    <div class="section">
      <div class="section-title">De-Samsung</div>
      <div class="card" id="sec-samsung">
        <!-- rows injected by JS -->
      </div>
      <div class="section-btn-wrap">
        <div class="section-btn" id="btn-all-samsung" onclick="disableSection('samsung')">Remove All Samsung Bloat</div>
      </div>
    </div>

    <!-- ── DE-GOOGLE ───────────────────────────────── -->
    <div class="section">
      <div class="section-title">De-Google</div>
      <div class="card" id="sec-google">
      </div>
      <div class="section-btn-wrap">
        <div class="section-btn" id="btn-all-google" onclick="disableSection('google')">Remove All Google Apps</div>
      </div>
    </div>

    <!-- ── PRIVACY HARDENING ──────────────────────── -->
    <div class="section">
      <div class="section-title">Privacy Hardening</div>
      <div class="card" id="sec-hardening">
        <!-- rendered by renderHardening() -->
      </div>
      <div class="section-btn-wrap">
        <div class="run-btn" onclick="runHardening()">Run Full Hardening Pass Now</div>
      </div>
    </div>

    <!-- ── AUTO-REBOOT ────────────────────────────── -->
    <div class="section">
      <div class="section-title">Auto-Reboot Watchdog</div>
      <div class="card">
        <div class="row">
          <div class="row-text">
            <div class="row-label">Reboot interval</div>
            <div class="row-desc">Forces Before-First-Unlock encryption state. Self-renewing.</div>
          </div>
          <div class="row-end">
            <input id="sp-hours" type="number" min="1" value="24" onchange="saveHours()">
            <span class="row-desc" style="white-space:nowrap">hrs</span>
          </div>
        </div>
      </div>
    </div>

  </div><!-- /scroll -->
  <div id="status-bar"></div>
</div>

<script>
// ── Data ─────────────────────────────────────────────────────────────────────
var SAMSUNG = [
  {pkg:'com.samsung.android.bixby.agent',   label:'Bixby',             desc:'Samsung voice assistant'},
  {pkg:'com.samsung.android.bixby.service', label:'Bixby Service',     desc:'Background service for Bixby'},
  {pkg:'com.samsung.android.bixby.wakeup',  label:'Bixby Wake-Up',     desc:'Always-on wake word detection'},
  {pkg:'com.sec.android.app.samsungapps',   label:'Galaxy Store',      desc:'Samsung\'s app store'},
  {pkg:'com.samsung.android.app.spage',     label:'Samsung Daily',     desc:'News feed / Edge panel content'},
  {pkg:'com.samsung.android.spay',          label:'Samsung Pay',       desc:'Samsung payment service'},
  {pkg:'com.samsung.android.arzone',        label:'AR Zone',           desc:'Augmented reality hub'},
  {pkg:'com.samsung.android.ar.emoji',      label:'AR Emoji',          desc:'AR Emoji creation'},
  {pkg:'com.samsung.android.game.gamehome', label:'Game Launcher',     desc:'Game library and overlay'},
  {pkg:'com.samsung.android.game.gos',      label:'Game Booster',      desc:'Game Optimizing Service (GOS)'},
  {pkg:'com.samsung.android.app.smartthings',label:'SmartThings',      desc:'IoT device control hub'},
  {pkg:'com.sec.android.app.shealth',       label:'Samsung Health',    desc:'Health and fitness tracking'},
  {pkg:'com.samsung.android.scloud',        label:'Samsung Cloud',     desc:'Samsung cloud backup'},
  {pkg:'com.samsung.android.app.routines',  label:'Modes & Routines',  desc:'Scheduled automation rules'},
  {pkg:'com.samsung.android.stickercenter', label:'Sticker Center',    desc:'Sticker download service'},
  {pkg:'com.samsung.android.smartsuggestions',label:'Smart Suggestions',desc:'AI clipboard and notification suggestions'},
  {pkg:'com.samsung.android.knox.analytics.uploader',label:'Knox Analytics',desc:'Samsung diagnostics uploader'},
  {pkg:'com.samsung.android.kgclient',      label:'Knox Guardian',     desc:'Enterprise MDM client'},
  {pkg:'com.samsung.android.messaging',     label:'Samsung Messages',  desc:'Samsung\'s default SMS/MMS app'},
  {pkg:'com.samsung.android.app.tips',      label:'Samsung Tips',      desc:'Tutorial and tips app'},
  {pkg:'com.sec.android.easyMover',         label:'Smart Switch',      desc:'Device migration tool'},
];

var GOOGLE = [
  {pkg:'com.google.android.googlequicksearchbox',label:'Google Search & Assistant',desc:'Google Search, Assistant, and app suggestions'},
  {pkg:'com.android.chrome',                label:'Chrome',            desc:'Google\'s browser with extensive telemetry'},
  {pkg:'com.google.android.apps.maps',      label:'Google Maps',       desc:'Location tracking via maps'},
  {pkg:'com.google.android.youtube',        label:'YouTube',           desc:'Google\'s video platform'},
  {pkg:'com.google.android.gm',             label:'Gmail',             desc:'Google mail client'},
  {pkg:'com.google.android.apps.photos',    label:'Google Photos',     desc:'Cloud photo backup to Google servers'},
  {pkg:'com.google.android.apps.youtube.music',label:'YouTube Music',  desc:'Google\'s music streaming service'},
  {pkg:'com.google.android.apps.docs',      label:'Google Drive',      desc:'Google cloud storage client'},
  {pkg:'com.google.android.apps.googleassistant',label:'Google Assistant',desc:'Standalone Google Assistant app'},
  {pkg:'com.google.android.apps.meetings',   label:'Google Meet',       desc:'Google video calling app'},
  {pkg:'com.google.android.apps.bard',       label:'Gemini',            desc:'Google AI assistant app'},
  {pkg:'com.android.vending',                label:'Play Store',        desc:'Google app store'},
  {pkg:'com.google.android.gms',             label:'Play Services',     desc:'Core Google services — breaks all Google apps if removed'},
];

var HARDENING_META = [
  {key:'WIFI_MAC_RANDOM',   label:'WiFi MAC randomisation', desc:'Randomise MAC address per network to prevent tracking.'},
  {key:'AUTO_REVOKE',       label:'Permission auto-revoke', desc:'Android revokes permissions from apps you haven\'t opened in months.'},
  {key:'RESTRICT_SIDELOAD', label:'Restrict sideloading',  desc:'Only Play Store, F-Droid, Magisk and this app may trigger installs.'},
  {key:'NFC_DISABLED',      label:'NFC off',               desc:'Disable NFC radio when not in use.'},
  {key:'BLUETOOTH_DISABLED',label:'Bluetooth off',         desc:'Disable Bluetooth radio.'},
  {key:'BLE_SCAN_DISABLED', label:'BLE always-scan off',   desc:'Prevent Bluetooth LE scanning while BT is off.'},
  {key:'WIFI_SCAN_DISABLED',label:'WiFi always-scan off',  desc:'Prevent WiFi scanning while WiFi is off.'},
  {key:'WIRELESS_ADB_DISABLED',label:'Wireless ADB off',   desc:'Disable ADB over WiFi.'},
];

// ── State ─────────────────────────────────────────────────────────────────────
var statuses = {};   // pkg → "installed"|"removed"|"missing"
var A = null;        // Android bridge

function jlog(m) { try { if(A&&A.log) A.log(String(m)); } catch(e){} }

window.onerror = function(msg,src,line,col){
  jlog('ERROR: '+msg+' @'+line+':'+col); return false;
};

// ── Boot ─────────────────────────────────────────────────────────────────────
var _poll = setInterval(function(){
  if(typeof Android !== 'undefined'){
    clearInterval(_poll);
    A = Android;
    init();
  }
}, 80);

function init(){
  var hasSu = A.hasSu();
  var badge = document.getElementById('root-badge');
  if(hasSu){
    badge.textContent = 'Rooted';
    badge.classList.remove('no-root');
  } else {
    badge.textContent = 'No Root';
    setStatus('Warning: su not found — package removal will fail');
  }

  renderSection('sec-samsung', SAMSUNG);
  renderSection('sec-google', GOOGLE);

  // Load all statuses in one synchronous call
  var allPkgs = SAMSUNG.concat(GOOGLE).map(function(x){return x.pkg;}).join(',');
  var raw = A.pkgStatuses(allPkgs);
  try {
    var obj = JSON.parse(raw);
    for(var k in obj) statuses[k] = obj[k];
  } catch(e) { jlog('pkgStatuses parse error: '+e); }

  // Update every row
  SAMSUNG.concat(GOOGLE).forEach(function(item){
    updateRow(item.pkg, statuses[item.pkg]||'missing');
  });

  A.getHardening();
}

// ── Section rendering ─────────────────────────────────────────────────────────
function renderSection(id, items){
  var card = document.getElementById(id);
  card.innerHTML = '';
  items.forEach(function(item){
    var row = document.createElement('div');
    row.className = 'row';
    row.id = 'row-' + safe(item.pkg);
    row.innerHTML =
      '<div class="row-text">'
      + '<div class="row-label">' + esc(item.label) + '</div>'
      + '<div class="row-desc">'  + esc(item.desc)  + '</div>'
      + '</div>'
      + '<div class="row-end">'
      + '<span class="pill pill-loading" id="pill-'+safe(item.pkg)+'">…</span>'
      + '<button class="btn btn-na" id="btn-'+safe(item.pkg)+'" onclick="togglePkg(\''+item.pkg+'\')"></button>'
      + '</div>';
    card.appendChild(row);
  });
}

// ── Status update ─────────────────────────────────────────────────────────────
function updateRow(pkg, status){
  statuses[pkg] = status;
  var id = safe(pkg);
  var pill = document.getElementById('pill-'+id);
  var btn  = document.getElementById('btn-'+id);
  if(!pill) return;

  pill.className = 'pill';
  btn.className  = 'btn';

  if(status === 'installed'){
    pill.textContent = 'Installed';
    pill.classList.add('pill-on');
    btn.textContent  = 'Remove';
    btn.classList.add('btn-disable');
  } else if(status === 'removed'){
    pill.textContent = 'Removed';
    pill.classList.add('pill-off');
    btn.textContent  = 'Restore';
    btn.classList.add('btn-enable');
  } else {
    pill.textContent = 'N/A';
    pill.classList.add('pill-na');
    btn.className    = 'btn btn-na';
  }
}

// ── Toggle one package ────────────────────────────────────────────────────────
function togglePkg(pkg){
  var current = statuses[pkg];
  if(!current || current==='missing') return;
  var enabling = (current === 'removed');
  var id = safe(pkg);
  var pill = document.getElementById('pill-'+id);
  var btn  = document.getElementById('btn-'+id);
  if(pill){ pill.textContent = enabling?'Restoring…':'Removing…'; pill.className='pill pill-loading'; }
  if(btn)  btn.style.opacity = '.4';
  A.setPkg(pkg, enabling);
}

// Called by Java when one package status changes
function onPkg(pkg, status){
  updateRow(pkg, status);
  var label = (statuses[pkg]==='removed') ? 'Removed' : 'Restored';
  setStatus(label + ': ' + pkg.split('.').pop());
}

// ── Disable entire section ────────────────────────────────────────────────────
function disableSection(which){
  var items = which==='samsung' ? SAMSUNG : GOOGLE;
  var toDisable = items.filter(function(x){ return statuses[x.pkg]==='installed'; });
  if(!toDisable.length){ setStatus('Nothing left to remove in this section.'); return; }

  var btnId = 'btn-all-' + which;
  var secBtn = document.getElementById(btnId);
  if(secBtn){ secBtn.textContent='Working…'; secBtn.classList.add('working'); }

  toDisable.forEach(function(item){
    var id = safe(item.pkg);
    var pill = document.getElementById('pill-'+id);
    if(pill){ pill.textContent='…'; pill.className='pill pill-loading'; }
  });

  A.disableAll(toDisable.map(function(x){return x.pkg;}).join(','));
}

// Called by Java when a batch disable finishes
function onBatch(csv){
  var pkgs = csv.split(',');
  pkgs.forEach(function(pkg){
    pkg = pkg.trim();
    if(pkg) { statuses[pkg]='removed'; updateRow(pkg,'removed'); }
  });
  // Re-enable section buttons
  var btns = document.querySelectorAll('.section-btn');
  for(var i=0;i<btns.length;i++){
    btns[i].classList.remove('working');
    btns[i].textContent = btns[i].id.indexOf('samsung')>=0
      ? 'Remove All Samsung Bloat' : 'Remove All Google Apps';
  }
  setStatus('Batch remove complete — ' + pkgs.length + ' apps.');
}

// ── Hardening ─────────────────────────────────────────────────────────────────
var hcfg = {};
function renderHardening(cfg){
  hcfg = cfg;
  var box = document.getElementById('sec-hardening');
  box.innerHTML = '';
  HARDENING_META.forEach(function(item){
    var on = !!(cfg[item.key]);
    var row = document.createElement('div');
    row.className = 'row';
    row.innerHTML =
      '<div class="row-text">'
      + '<div class="row-label">' + esc(item.label) + '</div>'
      + '<div class="row-desc">'  + esc(item.desc)  + '</div>'
      + '</div>'
      + '<label class="sw">'
      + '<input type="checkbox"' + (on?' checked':'') + '>'
      + '<span class="sw-track"></span></label>';
    var cb = row.querySelector('input');
    cb.addEventListener('change', (function(k){ return function(){ A.setHardening(k,cb.checked); }; })(item.key));
    box.appendChild(row);
  });
  // Reboot hours
  var h = cfg.rebootHours || 24;
  document.getElementById('sp-hours').value = h;
}

function saveHours(){
  var v = parseInt(document.getElementById('sp-hours').value, 10);
  if(!v||v<1) v=1;
  document.getElementById('sp-hours').value=v;
  A.setRebootHours(v);
  setStatus('Reboot interval saved: '+v+'h');
}

function runHardening(){
  A.runHardening();
  setStatus('Hardening pass triggered — check /data/local/tmp/plasma-theme.log');
}

// ── Utilities ─────────────────────────────────────────────────────────────────
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function safe(s){ return s.replace(/\./g,'_'); }
function setStatus(msg){
  var el = document.getElementById('status-bar');
  el.textContent = msg;
  setTimeout(function(){ if(el.textContent===msg) el.textContent=''; }, 3500);
}
</script>
</body>
</html>
